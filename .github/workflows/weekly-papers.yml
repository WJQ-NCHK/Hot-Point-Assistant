# 每周一下午（北京时间）自动抓取前沿论文并发送周报邮件。
#
# 时区换算：GitHub Actions 的 cron 用 UTC。
#   15:05 CST (UTC+8) = 07:05 UTC
#   （刻意避开整点 —— GitHub 整点任务量最大、排队最久，2026-09-14
#     实测 06:00 UTC 整点任务被跳过；错峰 5 分钟可靠性更高。）
#
# 免费额度：公共仓库 Actions 完全免费；私有仓库每月 2000 分钟免费额度，
#   本任务单次运行约 3-5 分钟，每月约 4 次 ≈ 20 分钟，几乎不消耗额度。
#
# 幂等保障：脚本内部按 ISO 周键拦截（见 tracker/state.py），
#   workflow 重试/手动重复触发也不会重复发信。

name: weekly-papers

on:
  schedule:
    # 每周一 07:05 UTC = 北京时间 15:05。避开整点（见文件头注释）。
    - cron: "5 7 * * 1"
  workflow_dispatch:        # 手动触发，用于部署后的验证
    inputs:
      force:
        description: "忽略本周已发送拦截（强制重发）"
        type: boolean
        default: false
      dry_run:
        description: "只生成报告不发送（预览模式）"
        type: boolean
        default: false

# 同一时间只允许一个实例，防止定时与手动触发并发导致的状态竞争
concurrency:
  group: weekly-papers
  cancel-in-progress: false

permissions:
  contents: write   # 回写 papers_seen.json 需要

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 零第三方依赖，无需 pip install —— 见 requirements.txt 说明

      - name: 运行周报流水线
        env:
          # ---- 敏感信息全部来自仓库 Secrets，不进代码不进日志 ----
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # ---- 非敏感配置 ----
          DOMAIN_NAME: 三维重建与新视图合成
          LOOKBACK_DAYS: "30"
          MAX_RESULTS: "60"
          MIN_PICKS: "5"
          MAX_PICKS: "10"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          set -o pipefail
          python run.py -v 2>&1 | tee run.log
          exit ${PIPESTATUS[0]}

      # 报告与状态无论如何都上传为 artifact：发送失败时成果不丢，
      # 且能从 Actions 页面直接看到本周生成的 HTML 报告
      - name: 上传报告与运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            reports/
            run.log
          retention-days: 90
          if-no-files-found: warn

      # 幂等回写：把更新后的 papers_seen.json 提交回仓库。
      # 只有发送成功（exit 0 且非 dry-run）才会改动此文件，无改动则跳过。
      - name: 回写去重状态（papers_seen.json）
        if: success()
        run: |
          if git diff --quiet -- .workbuddy/papers_seen.json; then
            echo "状态无变化，跳过提交"
          else
            git config user.name "weekly-bot"
            git config user.email "actions@github.com"
            git add .workbuddy/papers_seen.json
            git commit -m "chore: update papers_seen after weekly run ($(date -u +%F))"
            git push
          fi

      # GitHub 原生失败告警：Actions 页面会标红、给仓库所有者发邮件通知
      # （Settings → Notifications 里可配置「仅失败时通知」）
      - name: 失败摘要（便于排障）
        if: failure()
        run: |
          echo "::error::周报流水线执行失败，请下载本 run 的 artifact 查看 run.log 与 reports/"
