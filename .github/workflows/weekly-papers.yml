# 每周二北京时间 18:00 自动抓取前沿论文并发送周报邮件。
#
# ⏰ 发送时刻如何保证（2026-09-23 重构）：
#   GitHub 的 schedule 实测不守时 —— 2026-09-14 / 09-21 / 09-22 三次定时触发，
#   实际时间都比 cron 写的晚约 6.5 小时（6h42m / 6h15m），而不是分钟级排队。
#   因此不再指望 cron 的精度，改成两步：
#     1) cron 周二 00:18 与 04:02 UTC（北京 08:18 / 12:02）两次「提前唤醒」；
#     2) 「卡点到目标时刻」步骤把发送时刻夹到「当天周二 18:00 北京」。
#   按实测 6.5 小时延迟推算，实际醒来时间约为北京 14:30~15:00 / 18:00~19:00，
#   前者等 3 小时准点发、后者立即发（可能晚几分钟）。
#   若某天完全不延迟（08:18 醒），距目标 9.7 小时 > 6 小时等待上限，该轮会
#   跳过并在 Summary 里告警，同时第二个 cron 点（12:02）兜底；真要调整，
#   把 cron 挪到 09:00 UTC 附近即可，改完当天见效。
#
# ⚠ 变更记录：
#   2026-09-22 从「周一 15:05 CST」改为「周二 18:02 CST」；
#   2026-09-23 改为「周二两次提前唤醒 + 卡点到 18:00 发送」。
#   排查定时问题时，以 Actions 页面里该 run 的事件类型为准：
#   schedule = 定时触发，workflow_dispatch = 手动触发。
#
# 免费额度：公共仓库 Actions 完全免费；私有仓库每月 2000 分钟免费额度，
#   本任务每次约 3-5 分钟正式运行（等待时间也算），占用很小。
#
# 幂等保障：脚本内部按 ISO 周键拦截（见 tracker/state.py），
#   workflow 重试/手动重复触发也不会重复发信。
#
# 容错设计（2026-09-14 / 2026-09-21 实测教训）：
#   1. arXiv 不只按 IP 限流，还会按「请求特征」拒绝：
#        * HTTP 429 "Rate exceeded."（限流，分钟-小时级自愈）
#        * HTTP 406 "Not Acceptable"（直接拒绝该 UA/Accept 特征）
#      抓取层已改为「直连/公共代理 × 多种请求特征」组合矩阵自动切换
#      （tracker/arxiv_client.py），本层再做 3 次间隔 20 分钟的分批重试；
#   2. 失败的 run 不写状态 → 同周稍后再次触发会自动补发（幂等保护）。
#
# 排障可读性（2026-09-21 教训：三次尝试只看到一句 "exit code 1"，
# 完全不知道是配置缺失还是抓取被拒）：
#   - 退出码 1（必要配置缺失）直接失败，不再白等 40 分钟重试；
#   - 每种退出码都映射成明确原因，写进 ::error:: 注解与 Job Summary；
#   - 关键 Secret/SMTP 配置只打印「已设置(长度) / 未设置」，绝不打值。

name: weekly-papers

on:
  schedule:
    # 【重要】GitHub 的 schedule 不守时：本仓库 2026-09-14 / 09-21 / 09-22
    # 三次实测，实际触发时间比 cron 晚 6 小时以上，且延迟量不固定
    # （6h42m / 6h15m）。所以流程拆成两步：
    #   1) cron 只负责「在窗口内把 runner 叫醒」；
    #   2) 「卡点到目标时刻」步骤把发送时刻夹到「下一个周二 18:00（北京）」。
    #
    # 唤醒时间（周二两个点，北京时间 08:18 与 12:02）：
    #   * 实测 6~7 小时延迟 → 分别在实际 14:30~15:30 / 18:00~19:00 醒来，
    #     闸门把发送夹到 18:00（后者可能略晚几分钟，属正常）；
    #   * 延迟极大（>8h）时可能整轮跳过，同一 cron 的另一时间点兜底；
    #   * 若某天完全不延迟（08:18 醒）→ 距目标 9.7h 超过 6 小时等待上限，
    #     该轮跳过并告警；这时把 cron 往后挪到 ~09:00 UTC 即可，当天见效。
    # 判断依据：每次 run 的 Job Summary 会打印「本轮触发(北京)」与
    # 「实际发送时刻」，看一两次运行就能反推出当前延迟量。
    - cron: "18 0 * * 2"
    - cron: "2 4 * * 2"
  workflow_dispatch:        # 手动触发，用于部署后的验证
    inputs:
      force:
        description: "忽略本周已发送拦截（强制重发）"
        type: boolean
        default: false
      dry_run:
        description: "只生成报告不发送（预览模式）"
        type: boolean
        default: false
      arxiv_probe:
        description: "只诊断 arXiv 连通性（逐组合打印状态），不发信"
        type: boolean
        default: false

# 同一时间只允许一个实例，防止定时与手动触发并发导致的状态竞争
concurrency:
  group: weekly-papers
  cancel-in-progress: false

permissions:
  contents: write   # 回写 papers_seen.json 需要

jobs:
  send:
    runs-on: ubuntu-latest
    # 定时轮最长要等 6 小时（见「卡点到目标时刻再发」步骤），
    # 加上流水线本身最坏约 70 分钟（3 次尝试 + 2 次 20 分钟间隔），
    # 取 350 分钟；同时避开 GitHub 对单个 job 的 6 小时上限。
    timeout-minutes: 350

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 零第三方依赖，无需 pip install —— 见 requirements.txt 说明

      # GitHub 的 schedule 会晚 6 小时以上（见 on.schedule 注释），
      # 所以这里「提前唤醒、到点才发」：把发送时刻夹到下一个周二 18:00。
      # 目标时刻用 Python 算（比 bash 的 date -d "last monday" 可靠），
      # 并且以「目标日期」而不是「触发日期」作为幂等周键，避免延迟跨天后
      # 与其它轮的周键不一致。
      #   * 距目标 ≤ 等待上限 → 睡到目标时刻再发（准点送达）；
      #   * 距目标 > 上限（过早/过晚）→ 整轮跳过，等下一天那轮 cron 补。
      # 只对定时触发生效；手动触发一定跳过等待，保持可控。
      - name: 计算目标时刻（下一个周二 18:00 北京）
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone

          cst = timezone(timedelta(hours=8))
          now_utc = datetime.now(timezone.utc)
          now_cn = now_utc.astimezone(cst)
          # 下一个「周二」（isoweekday: 周一=1 … 周二=2 … 周日=7），今天就是周二则为 0
          days = (2 - now_cn.isoweekday()) % 7
          cand = (now_cn + timedelta(days=days)).replace(
              hour=18, minute=0, second=0, microsecond=0)
          if cand <= now_cn:
              cand += timedelta(days=7)
          target = int(cand.astimezone(timezone.utc).timestamp())
          print(f"SEND_TARGET_EPOCH={target}")
          print(f"SEND_TARGET_CN={cand:%Y-%m-%d %H:%M}")
          PY

      - name: 卡点到目标时刻再发（仅定时触发）
        env:
          MAX_WAIT_SECONDS: "21600"   # 最多等 6 小时，超过则跳过整轮
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "触发方式=${GITHUB_EVENT_NAME}（手动/API），跳过等待，立即执行。"
            echo "SEND_MOMENT=$(TZ=Asia/Shanghai date +'%F %H:%M')" >> "$GITHUB_ENV"
            exit 0
          fi
          now=$(date -u +%s)
          target="${SEND_TARGET_EPOCH:?目标时刻未计算}"
          today1800=$(date -u -d "$(TZ=Asia/Shanghai date +%F) 18:00 Asia/Shanghai" +%s)
          grace=43200   # 目标已过但在同一天内：仍然发送（晚到总比不发好）
          delta=$((target - now))
          echo "触发方式        ：${GITHUB_EVENT_NAME}"
          echo "本轮触发(北京)  ：$(TZ=Asia/Shanghai date +'%F %H:%M')"
          echo "发送目标(北京)  ：${SEND_TARGET_CN}"
          if [ "$delta" -lt "-$grace" ]; then
            echo "::warning::距目标（${SEND_TARGET_CN}）过远，本轮跳过，等下一轮 cron 在窗口内执行（GitHub 调度延迟所致，不是故障）"
            echo "SEND_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$delta" -gt "$MAX_WAIT_SECONDS" ]; then
            echo "::warning::距目标还有 $((delta / 3600)) 小时，超过等待上限 $((MAX_WAIT_SECONDS / 3600)) 小时；本轮跳过，等下一轮 cron"
            echo "SEND_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$delta" -gt 0 ]; then
            echo "::notice::等待 $((delta / 60)) 分，直到北京时间 ${SEND_TARGET_CN} 再执行"
            sleep "$delta"
          elif [ "$now" -ge "$today1800" ]; then
            echo "::warning::GitHub 定时触发晚于目标 $(( -delta / 60 )) 分钟，立即发送（调度延迟，非代码问题）"
          else
            echo "::notice::已在目标时刻附近，立即执行"
          fi
          echo "SEND_MOMENT=$(TZ=Asia/Shanghai date +'%F %H:%M')" >> "$GITHUB_ENV"
          echo "现在(北京) $(TZ=Asia/Shanghai date +'%F %H:%M')，开始执行流水线"

      - name: 运行周报流水线（含分批重试）
        id: pipeline
        if: env.SEND_SKIPPED != '1'
        env:
          # ---- 敏感信息全部来自仓库 Secrets，不进代码不进日志 ----
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # ---- 非敏感配置 ----
          DOMAIN_NAME: 三维重建与新视图合成
          LOOKBACK_DAYS: "30"
          MAX_RESULTS: "60"
          MIN_PICKS: "5"
          MAX_PICKS: "10"
          PROBE_ARXIV: ${{ github.event_name == 'workflow_dispatch' && inputs.arxiv_probe && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        # 分批重试：arXiv 限流/拒绝通常分钟-小时级自愈，隔 20 分钟再试
        # 比在同一时刻加码重试有效得多。失败不写状态，同周重跑即补发。
        #
        # 退出码语义（与 run.py --help 中同一张表）：
        #   0 成功/幂等跳过   1 配置缺失（重试无意义，直接失败）
        #   2 arXiv 抓取失败  3 LLM 失败   4 邮件发送失败
        run: |
          set -o pipefail
          if [ "$PROBE_ARXIV" = "1" ]; then
            echo "::notice::只做 arXiv 连通性诊断，不发送邮件"
            python run.py --probe-arxiv -v 2>&1 | tee run.log
            status=${PIPESTATUS[0]}
            echo "exit_code=$status" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

          # 配置缺失属于确定性错误：一次都不用试，避免白等 40 分钟
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_AUTH_CODE" ] || [ -z "$MAIL_TO" ] || [ -z "$LLM_API_KEY" ]; then
            {
              echo "::error::必要 Secret 缺失或为空（SMTP_USER / SMTP_AUTH_CODE / MAIL_TO / LLM_API_KEY）"
              echo "本仓库 Settings → Secrets and variables → Actions 需存在这 4 个 Repository secrets，且值不能为空。"
            } | tee run.log
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 注意：管道里 $? 是 tee 的退出码，必须用 PIPESTATUS[0] 取 python 的
          status=1
          code=0
          for i in 1 2 3; do
            echo "=== 第 $i/3 次尝试 ==="
            python run.py -v 2>&1 | tee run.log
            code=${PIPESTATUS[0]}
            if [ "$code" = "0" ]; then
              status=0
              break
            fi
            if [ "$code" = "1" ]; then
              echo "::error::配置缺失（退出码 1），重试无意义，直接失败"
              break
            fi
            echo "::warning::第 $i/3 次尝试失败（退出码 $code）"
            if [ "$i" -lt 3 ]; then
              echo "等待 20 分钟后重试（arXiv 限流通常分钟-小时级自愈）"
              sleep 1200
            fi
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$status"

      # 失败/成功都把「哪一步、什么原因」写进 Job Summary —— 不用下载 artifact
      # 就能看到结论；这里只打印配置项的存在性与长度，绝不打印 Secret 的值。
      - name: 退出码与排障摘要
        if: always()
        run: |
          python - <<'PY'
          import os

          REASONS = {
              "0": ("success", "成功：已发送 / 幂等跳过 / 预览完成"),
              "1": ("error", "必要配置缺失（Secret 未设置或为空）——重试无意义"),
              "2": ("error", "arXiv 抓取失败（限流 429 / 拒绝 406 / 网络不通）"),
              "3": ("error", "LLM 调用失败（鉴权 / 额度 / 网络）"),
              "4": ("error", "邮件发送失败（SMTP 认证或连接问题）——报告已落盘，下次调度自动补发"),
          }
          code = os.environ.get("RUN_EXIT", "")
          level, reason = REASONS.get(code, ("error", "未识别的失败（看 run.log 的 traceback）"))

          def state(key: str) -> str:
              value = os.environ.get(key)
              if value is None:
                  return "**从未注入**（Secret 不存在）"
              return f"已注入（{len(value)} 字符）" if value else "**已注入但为空**"

          rows = [
              ("SMTP_USER", ["SMTP_USER"]),
              ("SMTP_AUTH_CODE", ["SMTP_AUTH_CODE"]),
              ("MAIL_TO", ["MAIL_TO"]),
              ("LLM_API_KEY", ["LLM_API_KEY", "DEEPSEEK_API_KEY"]),
              ("SMTP_HOST", ["SMTP_HOST"]),
              ("SMTP_PORT", ["SMTP_PORT"]),
          ]
          lines = [
              "## weekly-papers 排障摘要",
              "",
              f"- 退出码：`{code or '未知'}` —— {reason}",
              "- 关键环境变量（只看存在性与长度，不显示值）：",
          ]
          for label, keys in rows:
              detail = " / ".join(f"`{k}` = {state(k)}" for k in keys)
              lines.append(f"  - {label}：{detail}")
          lines += [
              "",
              "> 退出码 1 = 去 Settings → Secrets and variables → Actions 补齐 Secret；",
              "> 退出码 2 = arXiv 限流/拒绝，稍后重跑或手动触发 `arxiv_probe` 诊断；",
              "> 退出码 3/4 = 看 run.log（artifact）里的错误行。",
          ]
          summary = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          print(summary)
          if level == "error" and code not in ("0", ""):
              print(f"::error::{reason}")
          PY
        env:
          RUN_EXIT: ${{ steps.pipeline.outputs.exit_code }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      # 报告与状态无论如何都上传为 artifact：发送失败时成果不丢，
      # 且能从 Actions 页面直接看到本周生成的 HTML 报告
      - name: 上传报告与运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            reports/
            run.log
          retention-days: 90
          if-no-files-found: warn

      # 幂等回写：把更新后的 papers_seen.json 提交回仓库。
      # 只有发送成功（exit 0 且非 dry-run）才会改动此文件，无改动则跳过。
      - name: 回写去重状态（papers_seen.json）
        if: success()
        run: |
          if git diff --quiet -- .workbuddy/papers_seen.json; then
            echo "状态无变化，跳过提交"
          else
            git config user.name "weekly-bot"
            git config user.email "actions@github.com"
            git add .workbuddy/papers_seen.json
            git commit -m "chore: update papers_seen after weekly run ($(date -u +%F))"
            git push
          fi

      # GitHub 原生失败告警：Actions 页面会标红、给仓库所有者发邮件通知
      # （Settings → Notifications 里可配置「仅失败时通知」）
      - name: 失败摘要（便于排障）
        if: failure()
        run: |
          echo "::error::周报流水线执行失败，查看上面的 Job Summary 或下载本 run 的 artifact 里的 run.log"
